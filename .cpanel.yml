---
# cPanel Git Version Control deployment.
#
# This used to be twenty-odd shell tasks written as a YAML list. It is now one line, because
# the install logic lives in scripts/host-deploy.sh where it can be read, reviewed and tested.
# It was tested: eight scenarios, including a checkout with no build in it, a copy that runs
# out of inodes half way, and a build that will not boot.
#
# YOU SHOULD NOT BE USING THIS BUTTON.
#
# cPanel's Git Version Control cannot do this job reliably, and several sessions went into
# proving it rather than accepting it:
#
#   "Update from Remote" pulls with --ff-only, and the deploy branch carries a full build, so
#   it gets rewritten and a fast-forward stops being possible. The checked-out branch also
#   keeps reverting to `main`, which has no build in it by design. And even when it all works,
#   it is two buttons plus a Restart plus remembering to check which branch you are on.
#
# The supported path is ~/deploy-rynet.sh, run by cron. It does `git fetch` and
# `git reset --hard origin/deploy`, which does not care about fast-forwards or which branch
# happened to be checked out, and then calls the same script this file calls. See
# DEPLOY-GIT.md.
#
# This is kept, and kept correct, only so that clicking the button cannot do damage. If the
# checkout has no build in it, host-deploy.sh refuses before it writes anything.

deployment:
  tasks:
    - bash scripts/host-deploy.sh
