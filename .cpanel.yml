---
# cPanel Git Version Control deployment.
#
# THIS BUTTON NOW WORKS, AND IT IS THE SUPPORTED PATH ON A HOST WITH NO SSH.
#
# It used to be two lines of shell that installed from the checked-out working tree, and that
# is why nothing had reached the live site since 3 September: the host's clone sits on `main`,
# `main` has no build in it by design, so "Deploy HEAD Commit" had nothing to install and
# refused. The checked-out branch drifting back to `main` is a cPanel behaviour nobody can turn
# off, and several sessions went into fighting it.
#
# scripts/cpanel-deploy.sh stops fighting it. It reads NOTHING from the working tree: it fetches
# the `deploy` branch, unpacks that commit with `git archive` into a staging directory, and
# installs from there. So the checked-out branch stops mattering, the index is never touched,
# and "Update from Remote" pulling `main` with --ff-only is fine, because `main` is the one
# branch that is never rewritten.
#
#   Update from Remote  ->  brings this file and the script up to date on the host
#   Deploy HEAD Commit  ->  runs the script, which installs the latest BUILD
#
# In that order, and nothing to restart afterwards: host-deploy.sh touches tmp/restart.txt. If
# the deploy branch has no build in it, or the site stops answering afterwards, it refuses or
# rolls back rather than leaving a broken site up.
#
# The same script is what cron should run, and what GitHub Actions runs over SSH when the
# account has it. See DEPLOY-GIT.md.

deployment:
  tasks:
    - bash scripts/cpanel-deploy.sh
